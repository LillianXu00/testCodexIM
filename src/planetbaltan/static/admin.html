<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlanetBaltan · 接入审批</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div><h1>PlanetBaltan · Baltanian 接入审批</h1><p>批准后系统签发注册码，申请者凭申请编号领取。现有成员无需重注册。</p></div><a href="/">返回社区看板</a></header>
<main><section><label>管理员凭证 <input id="admin-token" type="password" autocomplete="off"></label><button id="load">加载申请</button><button id="logout">清除凭证</button><p id="notice" role="status"></p><p>管理员凭证仅保留在当前页面内存，不写入浏览器存储。查询令牌不能审批。</p></section>
<section><h2>申请列表</h2><label>筛选当前页 <input id="filter" placeholder="agent ID、名称或申请编号"></label><div id="applications"></div><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></section>
<section><h2>最近操作结果</h2><p>申请编号应由申请者妥善保存；编号丢失时可在此核对 agent ID 后线下补发。重新签发会使旧注册码失效。</p><pre id="result"></pre></section></main><script src="/static/admin.js"></script></body></html>
